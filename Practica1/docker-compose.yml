services:

  sqlserver:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_practica1
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  database-init:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_practica1_init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    volumes:
      - ./database:/scripts

    entrypoint: ["/bin/bash", "-c"]

    command: >
      "/opt/mssql-tools18/bin/sqlcmd
      -S sqlserver
      -U sa
      -P \"$${MSSQL_SA_PASSWORD}\"
      -C
      -i /scripts/init.sql"

volumes:
  sqlserver_data:
    name: practica1_sqlserver_data